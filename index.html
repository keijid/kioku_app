<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>キオク — 間隔反復学習</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="description" content="忘れかけたタイミングで出題される暗記カードアプリ" />
<meta name="theme-color" content="#1C2230" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="キオク" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./apple-touch-icon.png" />
<link rel="icon" href="./icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Zen+Old+Mincho:wght@600;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #F3EFE6; overscroll-behavior-y: contain; }
  body {
    font-family: "Zen Kaku Gothic New", system-ui, sans-serif;
    color: #1C2230;
    -webkit-font-smoothing: antialiased;
  }
  a { color: #B8452C; text-decoration: none; }
  a:hover { color: #8E3320; }
  button { font-family: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  input, textarea, select { font-family: inherit; }

  /* インラインstyleで書けないホバー・フォーカスだけをここに置く */
  .cta { transition: transform .12s ease; }
  .cta:hover { transform: translateY(-2px); }
  .cta:active { transform: translateY(4px); box-shadow: 0 4px 0 #C4844B !important; }
  .lift { transition: transform .14s ease, box-shadow .14s ease; }
  .lift:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(28,34,48,.08); }
  .dark:hover { background: #2A3245 !important; }
  .soft:hover { background: #EDE7DA !important; }
  .ghost:hover { border-color: #1C2230 !important; color: #1C2230 !important; }
  .danger:hover { border-color: #B8452C !important; color: #B8452C !important; }
  .grade { transition: filter .12s ease; }
  .grade:hover { filter: brightness(.96); }
  input:focus, textarea:focus, select:focus { border-color: #C0B8A5 !important; }
  button:disabled { cursor: default; }

  @keyframes kk-rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes kk-pop { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="./app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () {});
    });
  }
</script>
</body>
</html>
